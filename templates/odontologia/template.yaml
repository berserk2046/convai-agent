    tue: [{ open: "08:00", close: "12:00" }, { open: "13:00", close: "18:00" }]
    wed: [{ open: "08:00", close: "12:00" }, { open: "13:00", close: "18:00" }]
    thu: [{ open: "08:00", close: "12:00" }, { open: "13:00", close: "18:00" }]
    fri: [{ open: "08:00", close: "12:00" }, { open: "13:00", close: "18:00" }]
