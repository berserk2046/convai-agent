        duration_min: 90,
        bookable: false,
      }
    - {
        key: ortodoncia,
        name: Ortodoncia,
        price_type: after_evaluation,
        duration_min: 30,
        description: Se inicia con una valoración de ortodoncia.,
      }
  insurers: []
  payment_methods: [Efectivo, Transferencia, Nequi, Tarjeta débito y crédito]
